name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c2185b&color_dots=#ffe4f1,#ffc2e0,#ff8fc7,#ff4da6,#c2185b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff4da6&color_dots=#2a0a1a,#5c1040,#9c1a6a,#d6338f,#ff6ec7

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}